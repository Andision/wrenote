# Wrenote default config
# Per design.v1.1 §6
# User overrides go in ~/.wrenote/config.yaml
# Env vars: WRENOTE_<SECTION>__<PARAMS>__<KEY>=...

compute:
  # Which native runtime build the STT / translator / chat backends run on.
  # auto = rank by detected hardware (see GET /api/compute/status), or pin one
  # of: cpu | metal | cuda | vulkan. The app bundle ships one built-in runtime
  # (metal on Apple Silicon, cpu elsewhere); accelerated packs are fetched into
  # runtimes_dir on demand. Takes effect on the next launch.
  accelerator: auto
  gpu_layers: null          # null = derive n_gpu_layers from the VRAM budget; int forces it
  vram_budget_mb: null      # null = 90% of the largest discrete GPU; unified memory = unbudgeted
  runtimes_dir: ""          # "" = <data.dir>/runtimes
  # Index of published packs; set to a mirror if GitHub is unreachable, or "" to disable installs.
  runtimes_index_url: https://github.com/Andision/wrenote/releases/download/runtimes/runtimes.json

# Whether to ask, once per launch, if a newer Wrenote has been released. The
# request fetches one small JSON file from the release index and sends nothing
# about you or this machine; set check: false to never ask automatically
# (Settings → General has the same switch, and a "check now" that works
# regardless). index_url: a mirror if GitHub is unreachable, or "" to disable.
update:
  check: true
  index_url: https://github.com/Andision/wrenote/releases/latest/download/latest.json

server:
  host: 127.0.0.1           # default localhost-only; do not change unless you accept LAN exposure
  port: 8000
  log_level: info

# Where the app keeps what it writes for you. `dir` is the root; each of the
# others is "" = under that root, or an explicit path to put just that
# elsewhere (models and recordings are the gigabytes). This file's own
# location (~/.wrenote/config.yaml) is fixed — it is where `dir` is read from.
data:
  dir: ~/.wrenote
  db_path: ""               # "" = <dir>/data.db — the session library
  recordings_dir: ""        # "" = <dir>/recordings — per-session WAVs (~115 MB/hour)

models:
  dir: ""                   # "" = <data.dir>/models — where weights are downloaded to
  catalogue_url: ""         # reserved: a published catalogue, so new models need no app release

# Each backend picks its weights by catalogue id (see engine/models.yaml and
# `GET /v1/models/status`). Setting params.model_path instead pins an explicit
# file — the escape hatch for a model we don't ship an entry for; nothing can be
# downloaded for it.
stt:
  backend: whisper_cpp
  model: whisper-large-v3-turbo-q5
  params:
    device: auto              # Metal on Mac, CUDA on Win, CPU fallback — whisper.cpp auto-detects
    language: null            # null = per-segment auto-detect (recommended). Pin to "en"/"zh"/… to force.

# Speech recognition for whole recordings — the pass after a recording
# stops, and uploads. Whisper is the right tool there (it decodes 30 s
# windows offline with context between them). `stt` above is what a live
# session hears; Settings → Models can put a streaming model there
# (zipformer-zh-en-streaming) while this stays Whisper.
stt_offline:
  backend: whisper_cpp
  model: whisper-large-v3-turbo-q5

vad:
  backend: silero
  params:
    threshold: 0.5

translator:
  # Runs the GGUF in a `llama-server` the engine starts and kills, rather than
  # loading it into the engine — so a llama.cpp crash costs a translation, not
  # the recording, and the memory comes back when the process exits. The
  # binary ships with the compute runtime (see `compute:` above).
  backend: llama_server
  model: hy-mt2-1.8b-q4
  params:
    n_ctx: 4096
    n_gpu_layers: -1          # offload all layers to Metal/CUDA; set 0 to force CPU
    temperature: 0.0
    max_concurrency: 1        # how many translations may be in flight at once
  # Or point it at a model service you run — see the note under `chat:` below.

speaker:
  # ECAPA-TDNN, exported from SpeechBrain to a torch-free ONNX (downloaded from
  # HuggingFace on first run, like the other models). Offline diarization only.
  backend: ecapa
  model: ecapa-voxceleb
  params: {}

chat:
  # Qwen3-4B-Instruct-2507 (July 2025). The server starts on the first chat
  # request and is killed when the engine exits; `backend: mock` skips the
  # model cost entirely for frontend work.
  backend: llama_server
  model: qwen3-4b-instruct-q4
  # Release the model after this long with nothing using it — 2.5 GB back for
  # a feature most sessions ask one question of, or none. 0 never releases.
  #
  # 15 minutes is chosen against the two ways it can be wrong. Too short and a
  # conversation pays for a reload between questions; too long and the memory
  # sits there all afternoon. A reload is a process start plus a model load —
  # seconds when the file is still in the OS cache, longer when it isn't — and
  # it looks to the user like a slow first answer, not like an error.
  #
  # Only meaningful because the model is a subprocess: releasing it is killing
  # a process, so the memory comes back. The translator needs no such timer —
  # it is built per session and goes when the session does.
  idle_unload_s: 900
  params:
    # 32K covers ~30-min meetings comfortably. Model was trained at 262K
    # native, so raising this further is safe — KV cache grows linearly
    # (~50 MB / 8K at this model size).
    n_ctx: 32768
    n_gpu_layers: -1
    binary: ""                # "" = the active runtime pack, then the PATH
  #
  # `backend: openai_compatible` reaches a model over HTTP instead of loading
  # one, and downloads nothing. Anything that serves POST /v1/chat/completions
  # works: llama-server, Ollama, LM Studio, vLLM, a shim in front of a CLI
  # agent, or a hosted API. Settings → Models writes this for you; the keys are
  # here for a config you keep by hand.
  #
  #   backend: openai_compatible
  #   endpoint:
  #     base_url: http://127.0.0.1:8080/v1   # a bare origin gets /v1 appended
  #     model: ""                 # "" = whatever the server serves; a hosted API needs a name
  #     api_key: ""               # or leave empty and use api_key_env
  #     api_key_env: OPENAI_API_KEY   # read from the environment at request time,
  #                                   # so the key is not written into this file
  #     headers: {}               # extra request headers, if a provider wants one
  #     extra_body: {}            # merged into the request body last (top_p, …)
  #     timeout_s: 120
  #
  # About `llama_server`, the default above: the binary ships in the compute
  # runtime for your accelerator (its bin/ goes on the PATH when a pack
  # activates, and the built-in runtime carries one in the app bundle);
  # `params.binary` names your own instead, and `params.extra_args` is passed
  # to it verbatim.
  #
  # The engine gives it a loopback port and a random --api-key, and kills it
  # on exit. A server left behind by a run that was killed outright is
  # reclaimed at the next start — but only after it proves it is ours, by
  # answering on the recorded port with the recorded token.
  #
  # `endpoint:` is separate from `params:` on purpose — `params` is the local
  # backend's tuning, and one dict holding both meant that configuring an
  # endpoint and then picking a local model again handed `base_url` to
  # llama.cpp as an unexpected argument. Both are kept, neither is mixed, so
  # switching back and forth remembers what you had.
  #
  # PRIVACY: a base_url on 127.0.0.1 is still local inference and the app says
  # so. Point it anywhere else and your transcripts are sent to that endpoint —
  # the app then says *that* instead, on the screen you start a recording from.

session:
  default_src_lang: auto    # "auto" = detect per segment; or pin to "en", "zh", …
  default_tgt_lang: zh
