# Model catalogue — what Wrenote can run, as data.
#
# `core/models.py` used to hard-code four models in a dict keyed by filename,
# which the config then had to match by writing that same filename into a path.
# Here a model has an id, and the config picks it by that id.
#
# `size` and `sha256` are not typed by hand:
#     python packaging/models/refresh_catalogue.py
# asks HuggingFace and writes them back (an LFS object id *is* the sha256 of the
# file's contents). `--check` fails on drift, so a model quietly replaced
# upstream is caught here rather than downloaded.
#
# Users extend this in ~/.wrenote/models.yaml; entries merge by id, so the same
# id overrides a shipped one and a new id adds to it.
#
# Fields
#   id        stable identifier, referenced by config as `stt.model: <id>`
#   kind      stt | translator | chat | speaker
#   backend   which registered backend can run it (core/registry.py)
#   tier      small | medium | large — what the hardware recommendation ranks
#   requires  the floor for offering it: ram_mb (and vram_mb where GPU-only)
#   files     one or more downloads; `param` names the backend argument the
#             local path is passed as
#   params    extra backend arguments this model needs (optional)

schema: 1

# Used when the config names no model for a kind. Deliberately the mid-range
# choice rather than the best one: a first run should work on a normal laptop,
# and Settings → Models can trade up.
defaults:
  stt: whisper-large-v3-turbo-q5
  stt_offline: whisper-large-v3-turbo-q5
  translator: hy-mt2-1.8b-q4
  chat: qwen3-4b-instruct-q4
  speaker: ecapa-voxceleb

models:
  # ---------- speech to text, streaming (sherpa-onnx) ----------
  # Built for live audio: text comes out as the audio comes in and the model
  # decides where utterances end. CPU-only, no runtime pack. English comes
  # out unpunctuated; the post-recording pass replaces it with Whisper's.

  - id: zipformer-zh-en-streaming
    kind: stt
    backend: sherpa_onnx
    tier: small
    name: Zipformer 中英 streaming (int8)
    note_code: stt_streaming
    requires: { ram_mb: 2048 }
    files:
      - param: encoder_path
        filename: zipformer-zh-en-encoder.int8.onnx
        repo: csukuangfj/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20
        path: encoder-epoch-99-avg-1.int8.onnx
        size: 181895032
