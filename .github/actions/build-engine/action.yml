name: Build engine
description: >-
  Build the web client, install the engine + native inference deps for this
  platform, compile the macOS capture helpers, verify the API contract, and
  freeze the engine sidecar with PyInstaller into engine/dist/wrenote-server/.
  Shared by every shell's packaging workflow.

inputs:
  llama_index:
    description: Extra pip index for the llama-cpp-python wheel (metal / cpu / cuda / vulkan)
    required: true
  python_version:
    description: Python version to freeze with
    required: false
    default: "3.11"
  node_version:
    description: Node version for the web client build
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Build web client SPA
      shell: bash
      working-directory: clients/web
      run: |
        npm install --no-audit --no-fund
        # A locale missing a key renders that key to the user, and nothing else
        # catches it — the app builds and runs fine in whichever language the
        # author speaks. Cheap gate, so it runs before the build.
        npm run check:locales
        npm run build

    - name: Install engine + packaging deps
      shell: bash
      working-directory: engine
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[desktop,streaming]"
        pip install pywhispercpp pyinstaller imageio-ffmpeg
        # Pin llama-cpp-python: the upstream 0.3.29 *metal* wheel on GitHub
        # Pages is corrupted at the source (BadZipFile / Bad CRC-32 on
        # ggml-config.cmake), so every download fails regardless of caching.
        # 0.3.28 is verified intact on both the metal and cpu indexes.
        # --no-cache-dir guards against a corrupt wheel getting cached and
        # re-hit on reruns; --retries covers transient network blips.
        pip install --no-cache-dir --retries 5 "llama-cpp-python==0.3.28" --extra-index-url ${{ inputs.llama_index }}

    - name: Install Windows-only deps (WebView2 + WASAPI loopback)
      if: runner.os == 'Windows'
      shell: bash
      run: pip install pythonnet soundcard

    - name: Smoke-import engine + verify the committed API contract
      shell: bash
      working-directory: engine
      run: |
        python -c "import wrenote.server, wrenote.run_server; print('import OK')"
        python -m wrenote.contract --check

    - name: Compile macOS capture helpers (system-audio + screen/window)
      if: runner.os == 'macOS'
      shell: bash
      working-directory: packaging/macos
      run: |
        swiftc -O -o syscap syscap.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia
        swiftc -O -o screencap screencap.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia -framework AppKit

    # Freeze the pure FastAPI server (no window code) into engine/dist/wrenote-server/.
    # Shells pick that folder up as a resource (Electron extraResources, Tauri bundle.resources).
    - name: Freeze engine sidecar (PyInstaller)
      shell: bash
      run: pyinstaller packaging/wrenote_server.spec --noconfirm --distpath engine/dist --workpath packaging/build

    # A frozen bundle can be missing a data file or a hidden import and still
    # build cleanly — PyInstaller only finds out at run time, which until now
    # meant the user found out. Boot it exactly as a shell does (spawn, read the
    # WRENOTE_PORT handshake) and ask it for something that touches the config,
    # the catalogue and the SPA it was supposed to bundle.
    - name: Smoke-test the frozen engine
      shell: bash
      run: |
        set -euo pipefail
        exe="engine/dist/wrenote-server/wrenote-server"
        [ -f "$exe.exe" ] && exe="$exe.exe"
        "$exe" > engine-boot.log 2>&1 &
        pid=$!
        trap 'kill $pid 2>/dev/null || true' EXIT

        port=""
        for _ in $(seq 1 60); do
          port="$(grep -m1 -oE 'WRENOTE_PORT=[0-9]+' engine-boot.log | cut -d= -f2 || true)"
          [ -n "$port" ] && break
          kill -0 $pid 2>/dev/null || { echo "engine exited before announcing a port"; cat engine-boot.log; exit 1; }
          sleep 1
        done
        [ -n "$port" ] || { echo "no WRENOTE_PORT after 60s"; cat engine-boot.log; exit 1; }
        echo "engine on :$port"

        base="http://127.0.0.1:$port"
        curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$base/health" > /dev/null
        # Reads config.yaml + models.yaml and resolves them — the paths most
        # likely to be missing from a bundle.
        curl -fsS "$base/v1/models/status" | grep -q '"all_present"'
        # Probes the hardware and reads the runtime state.
        curl -fsS "$base/v1/compute/status" | grep -q '"platform_tag"'
        # The SPA has to be inside the bundle, not just in the repo.
        curl -fsS "$base/" | grep -qi '<div id="root"'
        echo "frozen engine answers on /health, /v1 and /"
