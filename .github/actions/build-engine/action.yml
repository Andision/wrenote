name: Build engine
description: >-
  Build the web client, install the engine + native inference deps for this
  platform, compile the macOS capture helpers, verify the API contract, and
  freeze the engine sidecar with PyInstaller into engine/dist/wrenote-server/.
  Shared by every shell's packaging workflow.

inputs:
  python_version:
    description: Python version to freeze with
    required: false
    default: "3.11"
  node_version:
    description: Node version for the web client build
    required: false
    default: "20"
  llama_cpp_tag:
    description: >-
      llama.cpp tag to build `llama-server` from. This is not optional any
      more: `llama_server` is the default backend for chat and translation,
      so a build without one produces an app that cannot answer anything.
      Override only to move the pin.
    required: false
    default: "b9553"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Build web client SPA
      shell: bash
      working-directory: clients/web
      run: |
        npm install --no-audit --no-fund
        # A locale missing a key renders that key to the user, and nothing else
        # catches it — the app builds and runs fine in whichever language the
        # author speaks. Cheap gate, so it runs before the build.
        npm run check:locales
        npm run build

    - name: Install engine + packaging deps
      shell: bash
      working-directory: engine
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[desktop,streaming]"
        pip install pywhispercpp pyinstaller imageio-ffmpeg
        # No llama-cpp-python: language models run in a `llama-server` the
        # engine supervises (built below), not in this process.

    - name: Install Windows-only deps (WebView2 + WASAPI loopback)
      if: runner.os == 'Windows'
      shell: bash
      run: pip install pythonnet soundcard

    # The binary `backend: llama_server` runs (engine/wrenote/core/llama_server.py),
    # which is now how every language model runs. An accelerated Windows
    # install takes the per-accelerator copy from its runtime pack
    # (build-runtimes.yml); this is the built-in one, and it goes in the
    # bundle — packaging/*.spec picks it up from packaging/llama-server/.
    #
    # Cached on the tag, not compiled every time: the tag is pinned, so the
    # same tag on the same runner is the same binary, and llama.cpp's server
    # is 20 minutes on a 3-core runner. Without this, step 3 of
    # docs/plans/LLM_OUT_OF_PROCESS.md would put those 20 minutes on every
    # push to master.
    - name: Restore llama-server
      id: llama_server_cache
      uses: actions/cache@v4
      with:
        path: packaging/llama-server
        # The build definition is in the key, not just the tag: the flags below
        # decide what the binary links against, and a cache keyed on the tag
        # alone would have served a stale binary past the very next fix to
        # them — silently, which is the worst way for a build fix to fail.
        key: >-
          llama-server-${{ inputs.llama_cpp_tag }}-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.github/actions/build-engine/action.yml') }}

    - name: Build llama-server for the built-in runtime
      if: steps.llama_server_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 --branch "${{ inputs.llama_cpp_tag }}" \
          https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
        # Metal on macOS arm64 is llama.cpp's default there; elsewhere this is
        # the portable CPU build, which is what those platforms ship built in.
        #
        # OpenSSL off, both ways: cpp-httplib links it whenever CMake can find
        # it, and the runner has it. The server then needs libssl/libcrypto at
        # run time — which the first real build happened to get away with,
        # because PyInstaller ships Python's OpenSSL in the same directory.
        # That is a coincidence, not a design: it breaks the day Python's
        # OpenSSL moves or changes soname. We serve loopback, and llama.cpp
        # logs "running without SSL" regardless.
        cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DLLAMA_BUILD_SERVER=ON \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_CURL=OFF \
          -DLLAMA_SERVER_SSL=OFF \
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON
        cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release \
          --target llama-server --parallel
        exe="$(find "$RUNNER_TEMP/llama.cpp/build" -name 'llama-server*' -type f \
                 \( -name '*.exe' -o ! -name '*.*' \) | head -n1)"
        if [ -z "$exe" ]; then
          echo "llama-server was not produced" >&2
          exit 1
        fi
        # The flags above are only as good as their effect. A binary that
        # links OpenSSL runs on the runner and on a developer's machine and
        # fails on a user's, so assert it here rather than discovering it by
        # pulling the binary back out of a DMG. (Windows is covered by the
        # pack's DLL audit in build-runtimes.yml, which now reads .exe too.)
        if [ "$RUNNER_OS" = "macOS" ]; then
          if otool -L "$exe" | grep -qiE 'libssl|libcrypto'; then
            echo "llama-server links OpenSSL — the flags disabling it stopped working" >&2
            otool -L "$exe" >&2
            exit 1
          fi
        fi
        mkdir -p packaging/llama-server
        cp "$exe" packaging/llama-server/
        chmod +x packaging/llama-server/*
        # Logs the Metal device and the backends compiled in. It also reports
        # the tensor API as unavailable on some hardware; that is llama.cpp
        # probing at run time, not a build problem, and it was measured to
        # cost nothing (see docs/plans/LLM_OUT_OF_PROCESS.md).
        "$exe" --version || true

    - name: Smoke-import engine + verify the committed API contract
      shell: bash
      working-directory: engine
      run: |
        python -c "import wrenote.server, wrenote.run_server; print('import OK')"
        python -m wrenote.contract --check

    - name: Compile macOS capture helpers (system-audio + screen/window)
      if: runner.os == 'macOS'
      shell: bash
      working-directory: packaging/macos
      run: |
        swiftc -O -o syscap syscap.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia
        swiftc -O -o screencap screencap.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia -framework AppKit

    # Per-application audio on Windows. WASAPI's process loopback is a
    # different activation path from the endpoint loopback `soundcard` uses,
    # and no Python binding reaches it — see the file's header. Without this
    # exe the app still captures the whole output mix; it just cannot offer
    # "only this app".
    - name: Compile the Windows per-process audio helper
      if: runner.os == 'Windows'
      shell: cmd
      working-directory: packaging/windows
      # vswhere, not a hard-coded path: the runner image's Visual Studio
      # edition and version move, and a wrong guess fails with "'cl' is not
      # recognized", which reads like a missing toolchain rather than a
      # missing directory.
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        if not defined VSPATH exit /b 1
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cl /nologo /O2 /EHsc /std:c++17 procloop.cpp /Fe:procloop.exe /link ole32.lib mmdevapi.lib

    # Freeze the pure FastAPI server (no window code) into engine/dist/wrenote-server/.
    # Shells pick that folder up as a resource (Electron extraResources, Tauri bundle.resources).
    - name: Freeze engine sidecar (PyInstaller)
      shell: bash
      run: pyinstaller packaging/wrenote_server.spec --noconfirm --distpath engine/dist --workpath packaging/build

    # A frozen bundle can be missing a data file or a hidden import and still
    # build cleanly — PyInstaller only finds out at run time, which until now
    # meant the user found out. Boot it exactly as a shell does (spawn, read the
    # WRENOTE_PORT handshake) and ask it for something that touches the config,
    # the catalogue and the SPA it was supposed to bundle.
    - name: Smoke-test the frozen engine
      shell: bash
      run: |
        set -euo pipefail
        exe="engine/dist/wrenote-server/wrenote-server"
        [ -f "$exe.exe" ] && exe="$exe.exe"
        "$exe" > engine-boot.log 2>&1 &
        pid=$!
        trap 'kill $pid 2>/dev/null || true' EXIT

        port=""
        for _ in $(seq 1 60); do
          port="$(grep -m1 -oE 'WRENOTE_PORT=[0-9]+' engine-boot.log | cut -d= -f2 || true)"
          [ -n "$port" ] && break
          kill -0 $pid 2>/dev/null || { echo "engine exited before announcing a port"; cat engine-boot.log; exit 1; }
          sleep 1
        done
        [ -n "$port" ] || { echo "no WRENOTE_PORT after 60s"; cat engine-boot.log; exit 1; }
        echo "engine on :$port"

        base="http://127.0.0.1:$port"
        curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$base/health" > /dev/null
        # Reads config.yaml + models.yaml and resolves them — the paths most
        # likely to be missing from a bundle.
        curl -fsS "$base/v1/models/status" | grep -q '"all_present"'
        # Probes the hardware and reads the runtime state.
        curl -fsS "$base/v1/compute/status" | grep -q '"platform_tag"'
        # The SPA has to be inside the bundle, not just in the repo.
        curl -fsS "$base/" | grep -qi '<div id="root"'
        echo "frozen engine answers on /health, /v1 and /"
