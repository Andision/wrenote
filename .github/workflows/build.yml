name: build

on:
  workflow_dispatch:
  push:
    branches: ["init-codebase"]
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            artifact: Wrenote-macos-arm64
            llama_index: https://abetlen.github.io/llama-cpp-python/whl/metal
            dist_glob: shells/electron/release/mac-arm64
          - os: windows-latest
            artifact: Wrenote-windows-x64
            llama_index: https://abetlen.github.io/llama-cpp-python/whl/cpu
            dist_glob: shells/electron/release/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web client SPA
        working-directory: clients/web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install engine + packaging deps
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
          pip install pywhispercpp pyinstaller imageio-ffmpeg
          # Pin llama-cpp-python: the upstream 0.3.29 *metal* wheel on GitHub
          # Pages is corrupted at the source (BadZipFile / Bad CRC-32 on
          # ggml-config.cmake), so every download fails regardless of caching.
          # 0.3.28 is verified intact on both the metal and cpu indexes.
          # --no-cache-dir guards against a corrupt wheel getting cached and
          # re-hit on reruns; --retries covers transient network blips.
          pip install --no-cache-dir --retries 5 "llama-cpp-python==0.3.28" --extra-index-url ${{ matrix.llama_index }}

      - name: Install Windows-only deps (WebView2 + WASAPI loopback)
        if: runner.os == 'Windows'
        run: pip install pythonnet soundcard

      - name: Smoke-import engine (catch syntax/import errors before freezing)
        working-directory: engine
        run: |
          python -c "import wrenote.server, wrenote.run_server; print('import OK')"
          python -m wrenote.contract --check

      - name: Compile macOS capture helpers (system-audio + screen/window)
        if: runner.os == 'macOS'
        working-directory: packaging/macos
        run: |
          swiftc -O -o syscap syscap.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia
          swiftc -O -o screencap screencap.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia -framework AppKit

      # Freeze the pure FastAPI server (no pywebview) into engine/dist/wrenote-server/.
      # electron-builder picks it up via extraResources (../../engine/dist/wrenote-server).
      - name: Freeze engine sidecar (PyInstaller)
        run: pyinstaller packaging/wrenote_server.spec --noconfirm --distpath engine/dist --workpath packaging/build

      - name: Build Electron desktop app (electron-builder)
        working-directory: shells/electron
        env:
          # No code signing in CI: ad-hoc on macOS (identity:null), unsigned on
          # Windows. Disable auto-discovery so the mac build doesn't probe the
          # (empty) keychain and fail.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - name: List output
        working-directory: shells/electron/release
        run: ls -R . || dir

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_glob }}
          if-no-files-found: error
