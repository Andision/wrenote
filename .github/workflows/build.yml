name: build

on:
  workflow_dispatch:
  push:
    branches: ["init-codebase"]
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            artifact: Wrenote-macos-arm64
            llama_index: https://abetlen.github.io/llama-cpp-python/whl/metal
          - os: windows-latest
            artifact: Wrenote-windows-x64
            llama_index: https://abetlen.github.io/llama-cpp-python/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend + packaging deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
          pip install pywhispercpp pyinstaller imageio-ffmpeg
          pip install llama-cpp-python --extra-index-url ${{ matrix.llama_index }}

      - name: Install pythonnet (Windows WebView2 backend)
        if: runner.os == 'Windows'
        run: pip install pythonnet

      - name: Compile system-audio helper (macOS)
        if: runner.os == 'macOS'
        working-directory: backend/packaging/macos
        run: swiftc -O -o syscap syscap.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia

      - name: PyInstaller build
        working-directory: backend
        run: pyinstaller packaging/wrenote.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: List output
        working-directory: backend/packaging/dist
        run: ls -R . || dir

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/packaging/dist/
          if-no-files-found: error
