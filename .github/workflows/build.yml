name: build (electron)

on:
  workflow_dispatch:
  push:
    # No branch trigger: Tauri is the shell being validated (build-tauri.yml
    # covers master) and this one is on the way out — see "Retire the dead
    # shells" in TODO.md. A release tag still produces it while it exists.
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, not macos-14: the 14 image is in deprecation and fully
          # unsupported from 2026-11-02. Kept off macos-26 deliberately: a
          # newer SDK can raise the deployment target and quietly drop the
          # macOS versions users are on, and nothing here has measured that.
          # (This move does *not* change llama.cpp's "tensor API is not
          # supported in this environment" line — that was the first guess
          # and it was wrong; see docs/plans/LLM_OUT_OF_PROCESS.md.)
          - os: macos-15 # Apple Silicon
            artifact: Wrenote-macos-arm64
            dist_glob: shells/electron/release/mac-arm64
          - os: windows-latest
            artifact: Wrenote-windows-x64
            dist_glob: shells/electron/release/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-engine
        with:

      - name: Build Electron desktop app (electron-builder)
        working-directory: shells/electron
        env:
          # No code signing in CI: ad-hoc on macOS (identity:null), unsigned on
          # Windows. Disable auto-discovery so the mac build doesn't probe the
          # (empty) keychain and fail.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - name: List output
        working-directory: shells/electron/release
        run: ls -R . || dir

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_glob }}
          if-no-files-found: error
