name: build (tauri)

# Packages the Tauri shell alongside the Electron one while it is being
# validated (see shells/tauri/README.md for the manual checklist). Once Tauri is
# the shipping shell, this replaces build.yml.
#
# A `v*` tag is a release: the `release` job below attaches the installers to
# a GitHub Release together with latest.json, the index every installed copy
# reads to learn the release exists (engine/wrenote/core/update.py). To cut
# one:
#
#     python packaging/release/version.py set 0.2.0
#     git commit -am "release: 0.2.0" && git tag v0.2.0 && git push --tags
on:
  workflow_dispatch:
  push:
    branches: ["init-codebase", "claude/wrenote-repo-review-rurfrj"]
    tags: ["v*"]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            artifact: Wrenote-tauri-macos-arm64
            llama_index: https://abetlen.github.io/llama-cpp-python/whl/metal
            bundle_glob: |
              shells/tauri/src-tauri/target/release/bundle/dmg/*.dmg
              shells/tauri/src-tauri/target/release/bundle/macos/*.app
          - os: windows-latest
            artifact: Wrenote-tauri-windows-x64
            llama_index: https://abetlen.github.io/llama-cpp-python/whl/cpu
            bundle_glob: shells/tauri/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag matches the version in every manifest
        # Before the 20-minute build, not after: a release whose tag says
        # 0.2.0 over manifests that say 0.1.0 would ship an app that reports
        # the old version and nags itself to update.
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python packaging/release/version.py --check --tag "$GITHUB_REF_NAME"
          else
            python packaging/release/version.py --check
          fi

      - uses: ./.github/actions/build-engine
        with:
          llama_index: ${{ matrix.llama_index }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shells/tauri/src-tauri

      - name: Build Tauri desktop app
        working-directory: shells/tauri
        env:
          # No code signing in CI. macOS: Tauri skips signing without an
          # identity (the .app runs locally; Gatekeeper needs a signed build
          # for distribution). Windows: unsigned NSIS installer.
          CI: "true"
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  release:
    name: release
    # Tags only. The installers from both platforms become one GitHub Release,
    # and latest.json points every installed copy at them.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: Wrenote-tauri-*
          path: dist
          merge-multiple: true
      - name: Write latest.json
        # Maps each installer to the updater's platform key from its file name
        # and refuses an empty or ambiguous set — see packaging/release/.
        run: |
          python packaging/release/make_latest.py \
            --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" --dir dist --out dist/latest.json
          cat dist/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Wrenote ${{ github.ref_name }}
          generate_release_notes: true
          # "Latest" is what releases/latest/download/latest.json resolves to;
          # the rolling runtime-pack release is a prerelease so it never wins.
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/latest.json
